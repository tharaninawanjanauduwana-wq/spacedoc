<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Doc - Health Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#eef7f4;--panel:#fff;--ink:#14231f;--mute:#5f726c;--line:#dbe9e4;--teal:#0f9d84;--blue:#5b4fe0;--amber:#c27d12;--red:#d04a3f;--band:rgba(91,79,224,.12)}
.hd{background:var(--teal);color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 2px;font-weight:600}h2{font-size:17px;margin:0 0 4px;font-weight:600}
.sub{margin:0;max-width:62ch;opacity:.93}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px}
.stat.watch{border-left-color:var(--amber)}.stat.alert{border-left-color:var(--red)}
.stat b{display:block;font-size:22px;font-weight:600}.stat span{color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mute);font:11px "IBM Plex Sans",system-ui,sans-serif}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-weight:600}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid}
.tag.watch{color:var(--amber);border-color:var(--amber)}.tag.alert{color:var(--red);border-color:var(--red)}.tag.ok{color:var(--teal);border-color:var(--teal)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.kgrid{display:grid;grid-template-columns:190px 1fr;gap:20px}.kgrid svg{max-width:190px;margin:0 auto}@media(max-width:640px){.kgrid{grid-template-columns:1fr}}.kc{display:grid;grid-template-columns:1fr 96px 70px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);border-left:3px solid transparent}.kc.on{border-left-color:var(--teal);background:var(--bg)}.kc input{width:96px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
</style></head><body><main>
<div class="hd"><h1>Space Doc - Health Monitor</h1>
<p class="sub">Cardiovascular fitness and immune markers for study participants, with automatic flags when a person drifts from their own baseline or the group.</p></div>
<div class="bar" role="group" aria-label="View">

 <label id="selW">Participant <select id="sel"></select></label>
</div>
<div id="app"></div>
</main>

function renderK(){
 const fig=`<svg viewBox="0 0 140 300" role="group" aria-label="Body map: select a body part"><circle cx="70" cy="32" r="22" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><rect x="42" y="58" width="56" height="110" rx="18" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><path d="M42 68 L18 150 M98 68 L122 150 M56 168 L52 285 M84 168 L88 285" stroke="var(--line)" stroke-width="12" stroke-linecap="round" fill="none"/>
 ${[['head',70,32],['heart',76,92],['gut',70,138],['arm',24,130]].map(p=>`<circle id="h-${p[0]}" data-p="${p[0]}" cx="${p[1]}" cy="${p[2]}" r="11" fill="var(--teal)" stroke="#fff" stroke-width="2" tabindex="0" style="cursor:pointer"><title>${PARTS[p[0]].map(id=>IND.find(i=>i.id==id).n).join(', ')}</title></circle>`).join('')}</svg><p class="note">Select a dot to see the related check.</p>`;
 $('#app').innerHTML=`<div class="stats"><div class="stat" id="ov"></div><div class="stat"><b>${Object.keys(CI).length} day${Object.keys(CI).length==1?'':'s'}</b><span>Check-ins saved</span></div><div class="stat"><b style="font-size:15px">Daily: heart rate, blood pressure, temperature, sleep, mood. Weekly: fasting blood sugar.</b><span>Suggested routine</span></div></div>
 <section class="panel"><h2>Where are you?</h2><div class="seg">${Object.keys(ENVN).map(e=>`<button data-env="${e}">${e}</button>`).join('')}</div><p class="note" id="envn"></p><h2 style="margin-top:14px">What are you doing right now?</h2><div class="seg">${['Sleeping','Resting','Exercising','Other'].map(e=>`<button data-st="${e}">${e}</button>`).join('')}</div></section>
 <section class="panel kgrid"><div>${fig}</div><div>${IND.map(i=>`<div class="kc" id="c-${i.id}"><label for="i-${i.id}">${i.n} <small>(${i.u})</small></label><input id="i-${i.id}" type="number" inputmode="decimal" min="${i.a}" max="${i.b}" step="${i.s}" data-i="${i.id}" value="${vals[i.id]??''}"><span id="t-${i.id}"></span></div>`).join('')}<p style="margin:12px 0 0"><button id="sv">Save readings</button></p></div></section><section class="panel" id="det"></section>`;
 document.querySelectorAll('.kc input').forEach(e=>{e.oninput=()=>{vals[e.dataset.i]=e.value;sel=e.dataset.i;refreshK()};e.onfocus=()=>{sel=e.dataset.i;refreshK()}});
 document.querySelectorAll('circle[data-p]').forEach(c=>{const go=()=>{sel=PARTS[c.dataset.p][0];refreshK()};c.onclick=go;c.onkeydown=e=>{if(e.key=='Enter')go()}});
 $('#sv').onclick=()=>{const t=new Date().toISOString().slice(0,10);let n=0;IND.forEach(i=>{if(stat(i)>=0){(H[i.id]=H[i.id]||[]).push(+vals[i.id]);H[i.id]=H[i.id].slice(-14);n++}});
  if(n){CI[t]=1;try{localStorage.setItem('hm',JSON.stringify(H));localStorage.setItem('hmd',JSON.stringify(CI))}catch(e){}}
  $('#sv').textContent=n?'Saved':'Enter a reading first';setTimeout(()=>{if($('#sv'))$('#sv').textContent='Save readings'},1800);refreshK()};
 document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{ENV=b.dataset.env;refreshK()});
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ST=b.dataset.st;refreshK()});
 refreshK()}
function refreshK(){
 document.querySelectorAll('[data-env]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.env==ENV));
 document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st==ST));
 $('#envn').textContent=ENVN[ENV];
 IND.forEach(i=>{const s=stat(i);$('#t-'+i.id).innerHTML=s<0?'':tag(LV[s]);$('#c-'+i.id).classList.toggle('on',i.id==sel)});
 const w=Math.max(...IND.map(stat)),ov=$('#ov');ov.className='stat '+(w>=2?'alert':w==1?'watch':'');
 ov.innerHTML=w<0?'<b>Enter a reading</b><span>Your overall status appears here</span>':`<b>${['All clear','Keep watching','Contact the flight surgeon'][w]}</b><span>Overall status from today’s readings</span>`;
 Object.entries(PARTS).forEach(([p,ids])=>{const m=Math.max(...ids.map(id=>stat(IND.find(i=>i.id==id))));$('#h-'+p).style.fill=m>=2?'var(--red)':m==1?'var(--amber)':'var(--teal)'});
 const i=IND.find(x=>x.id==sel),s=stat(i),h=H[i.id]||[];
 $('#det').innerHTML=`<h2>${i.n} ${s>=0?tag(LV[s]):''}</h2><p><b>Normal range:</b> ${i.rng}</p><p><b>How to measure:</b> ${i.how}</p><p><b>Why it matters in space:</b> ${i.why}</p>${s<0?'':`<p><b>What to do:</b> ${s==0?'This is in range. Keep up your routine.':i.act[s-1]}</p>`}${h.length>1?`<h2 style="margin-top:12px">Saved readings</h2>${spark(h)}`:''}${ST=='Exercising'&&i.id!='hr'?'<p class="note">You are exercising. Rest for 10 minutes before taking this reading so the result is reliable.</p>':''}<p class="note">General guidance for research use. It does not replace advice from a flight surgeon.</p>`}

let cur=subs.find(s=>D.im[s]&&cv(s).peak.length)||subs[0],marker='CD3+_CD4+',view='S';
function render(){
 $('#vS').setAttribute('aria-pressed',view=='S');$('#vC').setAttribute('aria-pressed',view=='C');$('#vK').setAttribute('aria-pressed',view=='K');$('#selW').style.display=view=='S'?'':'none';
 view=='S'?renderS():view=='C'?renderC():renderK()}
function renderS(){
 const c=cv(cur),fl=flags(cur),hasIm=!!D.im[cur],na=fl.filter(x=>x.lvl=='alert').length,l=vlvl(c.chg);
 const il=!hasIm?'':na?'alert':fl.length?'watch':'ok';
 $('#app').innerHTML=`<div class="stats">
 <div class="stat ${l=='ok'?'':l}"><b>${c.chg==null?'No pre/post pair':(c.chg>0?'+':'')+c.chg.toFixed(0)+'%'}</b><span>Change in peak oxygen uptake (${f1(c.pre)} → ${f1(c.post)} ml/kg/min)</span></div>
 <div class="stat"><b>${c.hr??'–'} bpm</b><span>Highest heart rate in maximal tests</span></div>
 <div class="stat ${il=='ok'?'':il}"><b>${hasIm?fl.length+' flag'+(fl.length==1?'':'s'):'No immune data'}</b><span>${hasIm?'Immune markers outside this person’s usual range':'This participant has no immune results'}</span></div></div>
 <section class="panel"><h2>Peak oxygen uptake per test ${c.chg!=null?tag(l):''}</h2><p class="note" style="margin:0 0 8px">Higher means better aerobic fitness. A drop of 10% or more is a watch, 20% or more an alert.</p>${barChart(c)}</section>
 <section class="panel"><h2>Immune markers ${hasIm?tag(il):''}</h2>${hasIm?`<label>Marker <select id="mk">${markers.map(m=>`<option ${m==marker?'selected':''}>${m}</option>`).join('')}</select></label><p class="note">Values are % of cells (or the marker’s reported unit). Gaps mean the sample was not measured.</p>${lineChart(marker,cur)}
 <h2 style="margin-top:14px">Flagged readings</h2>${fl.length?`<div class="scroll"><table><thead><tr><th>Marker</th><th>When</th><th>Value</th><th>Own baseline</th><th>Distance from group change</th><th></th></tr></thead><tbody>${fl.slice(0,12).map(x=>`<tr><td>${x.m}</td><td>${TPL[x.t]}</td><td>${x.v}</td><td>${f1(x.b)}</td><td>${x.z>0?'+':''}${x.z.toFixed(1)} SD</td><td>${tag(x.lvl)}</td></tr>`).join('')}</tbody></table></div><p class="note">A flag means the change from this person’s baseline (average of Day −10 and −2) is 2 or more SD away from how the rest of the group changed. 3 or more is an alert.${fl.length>12?' Showing the 12 largest.':''}</p>`:'<p class="note">No readings are outside the expected range.</p>'}`:'<p class="note">No immune results exist for this participant in the dataset.</p>'}</section>`;
 const mk=$('#mk');if(mk)mk.onchange=e=>{marker=e.target.value;renderS()}}
function renderC(){
 const rows=subs.map(s=>{const c=cv(s),f=flags(s);return{s,c,n:D.im[s]?f.length:null,a:f.filter(x=>x.lvl=='alert').length}});
 const ch=rows.map(r=>r.c.chg).filter(x=>x!=null);
 $('#app').innerHTML=`<div class="stats"><div class="stat"><b>${subs.length}</b><span>Participants in the data</span></div>
 <div class="stat watch"><b>${ch.length?mean(ch).toFixed(0)+'%':'–'}</b><span>Average change in peak oxygen uptake (${ch.length} participants)</span></div>
 <div class="stat alert"><b>${rows.filter(r=>vlvl(r.c.chg)=='alert'||r.a).length}</b><span>Participants with at least one alert</span></div></div>
 <section class="panel"><h2>All participants</h2><p class="note" style="margin:0 0 8px">Select a row to open that participant.</p><div class="scroll"><table><thead><tr><th>ID</th><th>Peak VO2 before</th><th>After</th><th>Change</th><th>Immune flags</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{const st=r.a||vlvl(r.c.chg)=='alert'?'alert':(r.n>0||vlvl(r.c.chg)=='watch')?'watch':'ok';return`<tr class="row" tabindex="0" data-s="${r.s}"><td>${r.s}</td><td>${f1(r.c.pre)}</td><td>${f1(r.c.post)}</td><td>${r.c.chg==null?'–':r.c.chg.toFixed(0)+'%'}</td><td>${r.n==null?'–':r.n}</td><td>${tag(st)}</td></tr>`}).join('')}</tbody></table></div></section>`;
 document.querySelectorAll('tr.row').forEach(t=>{const go=()=>{cur=t.dataset.s;view='S';$('#sel').value=cur;render()};t.onclick=go;t.onkeydown=e=>{if(e.key=='Enter')go()}})}
$('#sel').innerHTML=subs.map(s=>`<option>${s}</option>`).join('');$('#sel').value=cur;
$('#sel').onchange=e=>{cur=e.target.value;render()};$('#vS').onclick=()=>{view='S';render()};$('#vC').onclick=()=>{view='C';render()};$('#vK').onclick=()=>{view='K';render()};
render();
</script></body></html>
